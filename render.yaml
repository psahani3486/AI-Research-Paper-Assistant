services:
  - type: web
    name: ai-research-assistant-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: groq/compound
      - key: EMBEDDING_MODEL_NAME
        value: all-MiniLM-L6-v2
      - key: CHUNK_SIZE
        value: 800
      - key: CHUNK_OVERLAP
        value: 150
      - key: TOP_K_RETRIEVAL
        value: 5
